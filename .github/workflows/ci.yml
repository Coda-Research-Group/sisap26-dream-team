name: CI

on:
  push:
    branches:
    - main
    - master
    tags: '*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Build Docker image
      run: docker build -t sisap-baseline .

    - name: Download datasets (small)
      run: bash download_datasets.sh --small-only

    - name: Run search (all tasks)
      run: bash run_search.sh

    - name: Evaluate and plot results of task 1
      run: |
        task=1
        cfg=data/wikipedia-small/config.json
        dataset=$(python -c "import json; print(json.load(open('$cfg'))['dataset_name'])")
        echo "=== Evaluating task$task / $dataset ==="
        python eval.py --results results/wikipedia-small/ res_task${task}.csv
        python plot.py --task task$task --dataset $dataset res_task${task}.csv

    - name: Evaluate and plot results of task 2
      run: |
        task=2
        cfg=data/llama-dev/config.json
        dataset=$(python -c "import json; print(json.load(open('$cfg'))['dataset_name'])")
        echo "=== Evaluating task$task / $dataset ==="
        python eval.py --results results/llama-dev/ res_task${task}.csv
        python plot.py --task task$task --dataset $dataset res_task${task}.csv

    - uses: actions/upload-artifact@v4
      with:
        name: Results
        path: |
          res_task*.csv
          result_*.png
